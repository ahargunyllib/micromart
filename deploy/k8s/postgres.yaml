      labels:
        app: postgres-inventory
    spec:
      containers:
        - name: postgres
          image: postgres:18.2-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "micromart"
            - name: POSTGRES_PASSWORD
              value: "micromart"
            - name: POSTGRES_DB
              value: "inventory_db"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U micromart -d inventory_db
            initialDelaySeconds: 30
